[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sudoku-toolkit"
version = "0.1.0"
description = "Parse and validate sudoku boards from files or stdin"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "robert-l345"}]

[project.scripts]
sudoku-toolkit = "sudoku_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["sudoku_toolkit*"]
